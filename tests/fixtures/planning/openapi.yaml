openapi: 3.1.1
info:
  title: Synthetic Message API
  version: 0.0.0
  x-byeori-id: API-MSG-001
paths:
  /messages:
    post:
      operationId: sendMessage
      x-byeori-features:
      - FEAT-MSG-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  minLength: 1
              required:
              - body
              additionalProperties: false
      responses:
        '201':
          description: 합성 메시지 생성 성공
        '400':
          description: 유효하지 않은 메시지
